name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: infra_lab
          POSTGRES_USER: infra
          POSTGRES_PASSWORD: infra_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U infra -d infra_lab"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://infra:infra_password@localhost:5432/infra_lab
      CORS_ORIGINS: '["http://localhost:8000"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy app
      - name: Tests
        run: python -m pytest
      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t infra-lab:ci .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format check
        run: terraform fmt -check -recursive terraform
      - name: Validate local Terraform
        run: terraform -chdir=terraform/local init -backend=false && terraform -chdir=terraform/local validate
      - name: Validate AWS Terraform without backend or credentials
        run: terraform -chdir=terraform/aws init -backend=false && terraform -chdir=terraform/aws validate
      - name: Terraform security scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/aws
          additional_args: --minimum-severity HIGH
          soft_fail: false
