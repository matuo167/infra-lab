[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "infra-lab"
version = "0.1.0"
description = "Full-stack infrastructure lab with FastAPI, Docker, Terraform, GitHub Actions, and AWS deployment support."
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic==1.14.1",
  "fastapi==0.115.6",
  "jinja2==3.1.5",
  "prometheus-client==0.21.1",
  "psycopg[binary]==3.2.3",
  "pydantic-settings==2.7.1",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.36",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.14.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = []
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"
markers = [
  "integration: tests that exercise the configured database service",
]
